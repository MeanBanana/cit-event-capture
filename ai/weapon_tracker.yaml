# Tracker settings for WEAPONS (weapons.py). Same as argus_tracker.yaml except
# the lines marked WEAPONS: weapon detectors give lower scores than YOLO does for
# people and vehicles, so the thresholds for starting/keeping a track are lower.
# argus_tracker.yaml - tracker settings for the Argus pipeline (used by detector.py).
#
# Based on Ultralytics' TrackTrack defaults ("Focusing on Tracks for Online
# Multi-Object Tracking", CVPR 2025). TrackTrack includes camera-motion
# compensation (gmc_method), which matters for shaky phone / dashcam footage:
# when the camera moves, it isn't mistaken for the vehicles moving.
#
# Changed from the defaults (marked ARGUS below):
#   track_buffer   30 -> 90   keep a vehicle's ID for ~3 s while it is hidden
#                             (e.g. behind another car or a person)
#   lost_match_thr 0  -> 0.9  allow a looser match when re-finding a vehicle
#                             after it was hidden, as Ultralytics suggests for
#                             long-occlusion scenes


tracker_type: tracktrack # (str) Tracker backend: tracktrack
track_high_thresh: 0.35 # WEAPONS (people/vehicles: 0.6). Weapon scores run lower
track_low_thresh: 0.15 # WEAPONS (0.25). Second-stage matches keep a weapon through blurry frames
new_track_thresh: 0.4 # WEAPONS (0.7). Otherwise most weapons would never start a track
track_buffer: 60 # WEAPONS. Weapons are checked every 2nd frame, so this is ~4-5 s of video
match_thresh: 0.7 # (float) Initial matching threshold for iterative assignment
lost_match_thr: 0.9 # ARGUS (default 0.0). (float) Looser rebind cost gate for still-Lost tracks; 0 disables the relaxed second pass. Raise above match_thresh (e.g. 0.9) for long-occlusion scenes

# Association weights
iou_weight: 0.5 # (float) Weight for HMIoU distance in cost matrix
reid_weight: 0.5 # (float) Weight for cosine distance (or HMIoU fallback if no ReID)
conf_weight: 0.1 # (float) Weight for confidence distance
angle_weight: 0.05 # (float) Weight for corner angle distance

# Iterative assignment
penalty_p: 0.2 # (float) Cost penalty for low-confidence detections
penalty_q: 0.4 # (float) Cost penalty for deleted/recovered detections
reduce_step: 0.05 # (float) Threshold reduction per iteration

# Track-Aware Initialization (TAI)
tai_thr: 0.55 # (float) IoU threshold for TAI NMS suppression
min_track_len: 2 # WEAPONS (3). Confirm sooner; weapons.py still needs 3 sightings

# Camera motion compensation
gmc_method: sparseOptFlow # (str) GMC method: sparseOptFlow, orb, sift, ecc, none

# ReID
with_reid: False # (bool) Enable ReID feature matching
model: auto # (str) ReID model path; 'auto' uses native YOLO features

# Tracker config for weapons (weapons.py). Copy of argus_tracker.yaml with the
# thresholds dropped, because the weapon models score a lot lower than YOLO
# does on people and cars. Changes from argus_tracker.yaml are commented.

tracker_type: tracktrack
track_high_thresh: 0.35 # was 0.6
track_low_thresh: 0.15 # was 0.25, helps hold on to a weapon through blurry frames
new_track_thresh: 0.4 # was 0.7, at 0.7 most weapons never got a track at all
track_buffer: 60 # we only check every 2nd frame, so this is ~4-5s of video
match_thresh: 0.7
lost_match_thr: 0.9

# association weights
iou_weight: 0.5
reid_weight: 0.5
conf_weight: 0.1
angle_weight: 0.05

# iterative assignment
penalty_p: 0.2
penalty_q: 0.4
reduce_step: 0.05

# track-aware initialisation
tai_thr: 0.55
min_track_len: 2 # was 3, weapons.py still wants 3 sightings before it reports anything

gmc_method: sparseOptFlow

with_reid: False
model: auto

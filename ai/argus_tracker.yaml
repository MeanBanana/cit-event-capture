# Tracker config for people and vehicles (detector.py).
#
# Started from Ultralytics' TrackTrack defaults. The main reason we use
# TrackTrack is its camera-motion compensation (gmc_method), so a shaky phone
# doesn't look like every car is moving.
#
# We only changed two things, marked "ours" below. Everything else is stock.

tracker_type: tracktrack
track_high_thresh: 0.6
track_low_thresh: 0.25
new_track_thresh: 0.7
track_buffer: 90 # ours, default 30. Keeps an ID for ~3s while a car is hidden behind something
match_thresh: 0.7
lost_match_thr: 0.9 # ours, default 0. Looser re-match after occlusion, as Ultralytics suggests for this kind of footage

# association weights
iou_weight: 0.5
reid_weight: 0.5
conf_weight: 0.1
angle_weight: 0.05

# iterative assignment
penalty_p: 0.2
penalty_q: 0.4
reduce_step: 0.05

# track-aware initialisation
tai_thr: 0.55
min_track_len: 3

gmc_method: sparseOptFlow # camera motion compensation

with_reid: False
model: auto

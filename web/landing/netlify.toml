# Netlify settings for the Argus Shield website (landing page + admin console).
# Netlify reads this file because the site's Base directory is web/landing.

[build]
  base    = "web/landing"
  command = "npm run build"
  # relative to base: web/landing/dist (the landing page, with the admin console in dist/admin/)
  publish = "dist"
  # Only rebuild when the website or the admin console changed (not on Flutter/AI commits).
  ignore  = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ../admin-console"

[build.environment]
  NODE_VERSION = "22"

# No /admin -> /admin/ redirect here: Netlify ignores trailing slashes when matching
# rules, so it would also catch /admin/ and loop. Netlify already adds the slash
# itself because dist/admin/index.html exists.

# Basic security headers for every page.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"

# The admin console should never be cached or indexed by search engines.
[[headers]]
  for = "/admin/*"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag  = "noindex, nofollow"

# The Android app (public/downloads/argus-shield.apk). Android phones only:
# netlify/edge-functions/apk-guard.ts answers 403 to every other device.
[[headers]]
  for = "/downloads/*"
  [headers.values]
    Content-Type        = "application/vnd.android.package-archive"
    Content-Disposition = "attachment; filename=\"argus-shield.apk\""
    Cache-Control       = "public, max-age=300"
    X-Robots-Tag        = "noindex"

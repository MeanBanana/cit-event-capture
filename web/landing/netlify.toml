# Netlify settings for the Argus Shield website (landing page + admin console).
# Netlify reads this file because the site's Base directory is web/landing.

[build]
  base    = "web/landing"
  command = "npm run build"
  # relative to base: web/landing/dist (the landing page, with the admin console in dist/admin/)
  publish = "dist"
  # Only rebuild when the website or the admin console changed (not on Flutter/AI commits).
  ignore  = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ../admin-console"

[build.environment]
  NODE_VERSION = "22"

# /admin -> /admin/ so the console's relative files (styles.css, app.js) load.
[[redirects]]
  from   = "/admin"
  to     = "/admin/"
  status = 301
  force  = true

# Basic security headers for every page.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"

# The admin console should never be cached or indexed by search engines.
[[headers]]
  for = "/admin/*"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag  = "noindex, nofollow"

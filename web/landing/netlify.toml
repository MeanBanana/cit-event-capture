# Netlify config for the website (landing page plus admin console). Netlify
# finds this because the site's base directory is set to web/landing.

[build]
  base    = "web/landing"
  command = "npm run build"
  # relative to base, so web/landing/dist (admin console ends up in dist/admin/)
  publish = "dist"
  # skip rebuilds for commits that don't touch the website or the console (Flutter, AI, etc.)
  ignore  = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ../admin-console"

[build.environment]
  NODE_VERSION = "22"

# Don't add an /admin -> /admin/ redirect. Netlify ignores trailing slashes
# when matching rules so it'd catch /admin/ too and loop forever. It adds the
# slash on its own anyway since dist/admin/index.html exists.

# basic security headers on everything
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"

# never cache or index the admin console
[[headers]]
  for = "/admin/*"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag  = "noindex, nofollow"

# The APK. apk-guard.ts sends a 403 to anything that isn't an Android phone.
[[headers]]
  for = "/downloads/*"
  [headers.values]
    Content-Type        = "application/vnd.android.package-archive"
    Content-Disposition = "attachment; filename=\"argus-shield.apk\""
    Cache-Control       = "public, max-age=300"
    X-Robots-Tag        = "noindex"

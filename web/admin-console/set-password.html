<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Argus Shield · Set password</title>
  <link rel="icon" href="logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Where Supabase password emails land (account setup links and normal resets). -->
  <main class="login">
    <div class="login-card">
      <img class="login-logo" src="logo.svg" alt="Argus Shield logo" width="92" height="103">
      <h1 class="brand">Argus Shield</h1>
      <p class="brand-sub">Choose your password</p>

      <p id="checking" class="muted">Checking your link…</p>

      <form id="password-form" novalidate hidden>
        <p class="muted" id="password-who"></p>
        <label class="field">
          <span>New password</span>
          <span class="with-button">
            <input id="password" type="password" autocomplete="new-password" required minlength="8">
            <button type="button" class="ghost small" data-toggle-password="password">Show</button>
          </span>
          <small class="hint">At least 8 characters, with letters and numbers.</small>
        </label>
        <label class="field">
          <span>Repeat password</span>
          <input id="password-again" type="password" autocomplete="new-password" required>
        </label>
        <p id="password-error" class="form-error" role="alert" hidden></p>
        <button id="password-submit" class="primary wide" type="submit">Save password</button>
      </form>

      <div id="password-done" class="done" hidden>
        <div class="done-icon">✓</div>
        <h2>Password saved</h2>
        <p class="muted">Open the Argus Shield app and sign in with your username and this password.</p>
      </div>

      <p id="link-error" class="form-error" role="alert" hidden></p>
    </div>
  </main>

  <script src="vendor/supabase-2.118.0.js"></script>
  <script src="config.js"></script>
  <script src="set-password.js"></script>
</body>
</html>
